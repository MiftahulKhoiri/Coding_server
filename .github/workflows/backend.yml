name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "requirements*.txt"
      - "scripts/**"
      - ".github/workflows/backend.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: /home/runner/.dotnet
        with:
          dotnet-version: "8.0.x"
      - name: Pasang compiler & sandbox
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap php-cli sqlite3 > /dev/null
      - name: Izinkan user namespace untuk bubblewrap (Ubuntu 24.04 AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: pip install -r requirements-dev.txt
      - name: Status engine
        run: python scripts/health_check.py --engines --url ""
      - name: Pytest
        run: python -m pytest -q -p no:logging backend/tests
