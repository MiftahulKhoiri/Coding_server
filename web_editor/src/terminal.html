<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="description" content="CODING_SERVER Terminal">
  <title>CODING_SERVER Terminal</title>
  <style>/*__CSS__*/</style>
  <style>
    /* Halaman dikunci (tidak bisa bergeser/zoom): terminal mengisi tepat seukuran layar. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #1e1e1e; overflow: hidden;
                 position: fixed; inset: 0; overscroll-behavior: none; touch-action: pan-y; }
    /* Terminal harus mengisi seluruh layar: addon fit menghitung kolom/baris dari ukuran elemen ini.
       Tanpa ukuran (hanya top/left) lebarnya menyusut ke ~0 -> xterm jatuh ke 2 kolom. */
    #terminal { position: absolute; top: 2px; left: 4px; right: 4px; bottom: 2px; overflow: hidden; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script>/*__JS__*/</script>
</body>
</html>
