<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>CODING_SERVER Editor</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      display: block;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      position: relative;
    }
    body.dark { background-color: #282c34; }
    body.light { background-color: #ffffff; }
    /* Beri CodeMirror ruang melalui flex, bukan rantai height:100% yang rapuh. */
    #editor {
      display: flex;
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: auto;
      position: relative;
      overflow: hidden;
    }
    .cm-editor {
      display: flex;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: auto !important;
      overflow: hidden;
    }
    .cm-scroller {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      height: auto !important;
      overflow: auto;
    }
    .cm-content { min-height: 100%; }
    .cm-panels { font-size: 14px; }
    .cm-panel.cm-search input, .cm-panel.cm-search button { font-size: 14px; padding: 4px 6px; }
  </style>
</head>
<body class="dark">
  <div id="editor"></div>
  <script>/*__JS__*/</script>
</body>
</html>
