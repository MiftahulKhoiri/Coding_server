<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>CODING_SERVER Editor</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    body.dark { background-color: #282c34; }
    body.light { background-color: #ffffff; }
    #editor { height: 100vh; }
    .cm-editor { height: 100%; }
    .cm-panels { font-size: 14px; }
    .cm-panel.cm-search input, .cm-panel.cm-search button { font-size: 14px; padding: 4px 6px; }
  </style>
</head>
<body class="dark">
  <div id="editor"></div>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@6.5.1/lib/codemirror.js" integrity="sha512-lW9qM/7bQxP2C3bF6XJ6VqYkz5fOyC9BxwYlLZ8UQw9Vz3Y8xgj+U2P4tF3s0N6OjTQJ6KZJzqNwvP0wH8z3x1YJ5zQWZ0w=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@6.5.1/mode/clike/clike.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@6.5.1/mode/javascript/javascript.js"></script>
  <script>
    const editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
      mode: 'javascript',
      theme: 'monokai',
      lineNumbers: true,
      lineWrapping: true
    });
  </script>
</body>
</html>
