<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>CODING_SERVER Editor</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    body.dark { background-color: #282c34; }
    body.light { background-color: #ffffff; }
    #editor { position: fixed; inset: 0; width: 100vw; height: 100vh; overflow: hidden; }
    .cm-editor { position: absolute; inset: 0; height: 100% !important; width: 100%; min-height: 1px; }
    .cm-scroller { height: 100% !important; min-height: 1px; overflow: auto; }
    .cm-content { min-height: 1px; }
    .cm-panels { font-size: 14px; }
    .cm-panel.cm-search input, .cm-panel.cm-search button { font-size: 14px; padding: 4px 6px; }
  </style>
</head>
<body class="dark">
  <div id="editor"></div>
  <script>/*__JS__*/</script>
</body>
</html>
